metadata:
  name: blitzy-webvella-erp-api
  description: WebVella ERP headless REST API (/api/v1/) — OpenAPI 3.1 contract for records,
    entities, EQL, and files
spec:
  type: openapi
  lifecycle: experimental
  owner: blitzy-sandbox
  system: blitzy-dotnet
  # The OpenAPI 3.1 document is auto-generated and served at /openapi/v1.json by the
  # WebVella.Erp.Api host (via Microsoft.AspNetCore.OpenApi) and published to ./openapi/v1.json
  # by that implementation workstream (AAP §0.5.2, §0.10.1). Note: this artifact is NOT present
  # in the current checkout — the /api/v1/ host is the planned target built separately
  # (Source: WebVella.Erp.Api/README.md, "Status — planned target"). Path per AAP: ./openapi/v1.json.
  definition:
