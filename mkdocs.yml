site_name: 'blitzy-WebVella-ERP'
# Site-wide meta description. The Material theme (via techdocs-core) emits
# `<meta name="description" content="...">` from `config.site_description` as the
# fallback whenever a page has no per-page description. The repository's TechDocs
# HTML-comment frontmatter convention (`<!--{"sort_order":...}-->`) does not populate
# MkDocs' native `description:` field, so without this fallback no page emitted a
# meta description (QA finding #4, SEO/shareability). One site-wide line closes the
# gap without changing any per-page frontmatter (minimal-change convention).
site_description: 'Developer, integrator, and operator documentation for the WebVella ERP headless, container-native platform: REST/OpenAPI reference, plugin SDK, architecture, migration, and deployment guides.'
