site_name: 'blitzy-WebVella-ERP'
nav:
  - Home: index.md
# Documentation-build hook (MkDocs core `hooks:`, no extra dependency): copies the
# repository-root `doc-images/` directory into the built site so the developer docs'
# absolute `/doc-images/*.png` references resolve in a plain `mkdocs build` deployment.
# `doc-images/` lives outside `docs_dir`, so MkDocs would otherwise leave it uncopied
# and those screenshots would 404 (QA Issue #5). The hook is additive and idempotent.
hooks:
  - mkdocs_hooks.py
plugins:
  - techdocs-core
  - mermaid2:
      # Pin Mermaid and serve it from a locally bundled copy under docs/assets/mermaid/
      # so diagrams render in the container-native / air-gapped target with no CDN dependency
      # (AAP §0.7.1 "bundle Mermaid locally"). The single self-contained UMD build exposes a
      # global `mermaid`, so mermaid2 loads it via a classic <script src> tag and calls
      # mermaid.initialize(), avoiding the ESM startOnLoad race.
      version: 11.16.0
      javascript: assets/mermaid/mermaid.min.js
# Register a superfences custom fence for ```mermaid so techdocs-core's bundled
# pymdownx.superfences no longer emits a highlighted code block for it. Using
# mermaid2.fence_mermaid emits <div class="mermaid"> (mermaid2's own marker), which the
# Material theme's native mermaid handler (selector `pre.mermaid`) deliberately ignores —
# leaving mermaid2 as the single renderer and preventing the double-init that left empty
# "ghost" diagram containers.
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid